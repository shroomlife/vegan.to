name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Only the deploy job may write, and only to Pages
permissions:
  contents: read

# Supersede a pull request run, never cancel a production deploy halfway through
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  quality:
    name: Lint, types, end-to-end
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Reads the bun version from the packageManager field in package.json
      - uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      # Covers the app and, through tsconfig.node.json, the scripts, the e2e suite
      # and the vite config. bun run build repeats it, this step just fails on its own line
      - name: Type check
        run: bun run typecheck

      # Both Playwright projects are chromium, Desktop Chrome and Pixel 7
      - name: Install Playwright browser
        run: bunx playwright install --with-deps chromium

      # playwright.config.ts builds into docs/ and previews it, so the suite runs
      # against the exact artifact that gets deployed below
      - name: End-to-end tests
        run: bun run test:e2e

      - name: Keep the report when something fails
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

      - name: Hand the tested build to Pages
        if: github.event_name == 'push'
        uses: actions/upload-pages-artifact@v5
        with:
          path: docs

  deploy:
    name: Deploy to vegan.to
    if: github.event_name == 'push'
    needs: quality
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5

  indexnow:
    name: Ping IndexNow
    if: github.event_name == 'push'
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      # The script reads public/indexnow-key.txt and src/data/routes.ts, both
      # dependency free, so it runs straight from the checkout without an install
      - name: Submit every route
        run: bun run indexnow
